<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#009879">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TiNa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>TiNa-WebApp</title>
<style>
:root { color-scheme: light; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: eine Spalte wie eine Handy-App. Oben Titel + Einstellungen, unten feste Tab-Leiste, Heute-Seite als Übersicht aller offenen Dinge. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --fg: #15282C;
  --muted: #55696D;
  --line: #D6DFDD;
  --accent: #00826A;
  --brand: #009879;
  --accent-fg: #FFFFFF;
  --accent-soft: #DDF1EC;
  --warn: #A8500A;
  --warn-soft: #FBE9D5;
  --ok: #1E7A45;
  --c-fam: #B4426B;
  --c-term: #00826A;
  --c-rech: #8A6D00;
  --c-post: #4F6BC2;
  --c-sonst: #6B7B7E;
  --font-display: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  --base: 17px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1F1B; --surface: #16302A; --fg: #E6F0ED; --muted: #9FB8B1; --line: #274A41;
    --accent: #3FD0AE; --accent-fg: #04281F; --accent-soft: #1B3D34; --warn: #F0A860; --warn-soft: #3A2B18; --ok: #6FD39A;
    --c-fam: #E987AC; --c-term: #3FD0AE; --c-rech: #E0BF4A; --c-post: #8FA6F0; --c-sonst: #9DB2B4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1F1B; --surface: #16302A; --fg: #E6F0ED; --muted: #9FB8B1; --line: #274A41;
  --accent: #3FD0AE; --accent-fg: #04281F; --accent-soft: #1B3D34; --warn: #F0A860; --warn-soft: #3A2B18; --ok: #6FD39A;
  --c-fam: #E987AC; --c-term: #3FD0AE; --c-rech: #E0BF4A; --c-post: #8FA6F0; --c-sonst: #9DB2B4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: var(--base); line-height: 1.5; padding-inline: 16px; padding-block: 0 96px; }
body[data-size="gross"] { --base: 20px; }
.wrap { max-width: 640px; margin-inline: auto; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; border-bottom: 3px solid var(--brand); margin-bottom: 16px; }
.logo { width: 46px; height: 46px; border-radius: 12px; flex: none; }
.top h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.icon-btn { margin-left: auto; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn svg { width: 24px; height: 24px; }
svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.sample { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: .88rem; margin-bottom: 16px; }
.hello { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.hello h2 { font-size: 3rem; font-weight: 700; letter-spacing: -.02em; }
.hello p { margin: 0; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }

.sec { margin-bottom: 26px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sec-head h3 { font-size: 1.2rem; font-weight: 800; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 6px 0; min-height: 44px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 56px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; overflow-wrap: anywhere; }
.row .s { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 3.6rem; color: var(--accent); }
.dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 7px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 12px; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
.filters button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.unread .t::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); margin-left: 8px; }
.done { opacity: .65; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.back { align-self: flex-start; }
.mail-head h2 { font-size: 1.4rem; font-weight: 800; overflow-wrap: anywhere; }
.mail-body { white-space: pre-wrap; overflow-wrap: anywhere; }
.termin { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.termin strong { font-family: var(--font-display); }
label { font-weight: 700; font-size: .92rem; }
textarea, input[type="text"], input[type="date"], input[type="time"], select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; }
textarea { min-height: 150px; resize: vertical; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-weight: 700; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }

.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 16px; }
.days button { min-height: 62px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 0; }
.days button span:first-child { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.days button span:last-child { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.days button[aria-pressed="true"] span { color: var(--accent-fg); }
.days button.has::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }

.note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.note .who { font-size: .85rem; color: var(--muted); margin-top: 4px; }
.note p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.info { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: .92rem; }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row .s { color: var(--muted); font-size: .88rem; }
.pill { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.soon { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { min-height: 44px; padding: 0 16px; border: 0; background: var(--surface); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; z-index: 6; }
.nav button { border: 0; background: none; min-height: 58px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: .8rem; font-weight: 700; position: relative; }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.nav .badge { position: absolute; top: 4px; left: calc(50% + 8px); background: var(--warn); color: #fff; font-size: .7rem; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding-inline: 5px; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: 608px; margin-inline: auto; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 16px; z-index: 9; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out; } @keyframes up { from { transform: translateY(8px); opacity: 0; } } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img class="logo" alt="Tina Taube" width="46" height="46" src="icons/logo-header.png">
    <h1 id="title">Heute</h1>
    <button class="icon-btn" data-go="settings" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div class="sample" id="sample">Alle Inhalte sind Beispiele. Die Verbindung zu Mail, Kalender und Notizen kommt im nächsten Schritt.</div>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<nav class="nav" aria-label="Hauptmenü" id="nav"></nav>

<script src="config.js"></script>
<script src="mail-logic.js"></script>
<script src="google.js"></script>
<script src="notes.js"></script>
<script src="app.js"></script>

</body>
</html>
